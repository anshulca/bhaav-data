name: Update Bhaav IPO data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch fresh IPO data
        run: node fetch-ipo.js

      - name: List files (debug)
        run: |
          echo "----- files in this folder -----"
          ls -la
          echo "----- looking for bhaav-data.json -----"
          test -f bhaav-data.json && echo "FOUND bhaav-data.json" || echo "NOT FOUND"

      - name: Commit updated data
        run: |
          git config user.name  "bhaav-bot"
          git config user.email "bhaav-bot@users.noreply.github.com"
          if [ -f bhaav-data.json ]; then
            git add -A
            if git diff --staged --quiet; then
              echo "No change - nothing to commit."
            else
              git commit -m "auto: update IPO data $(date -u '+%Y-%m-%d %H:%M UTC')"
              git push
              echo "Pushed updated data."
            fi
          else
            echo "bhaav-data.json was not created - skipping commit."
          fi
