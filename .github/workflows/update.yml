name: Update Bhaav IPO data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch fresh IPO data
        run: node fetch-ipo.js

      - name: Show what was produced
        run: |
          echo "----- first 400 chars of bhaav-data.json -----"
          head -c 400 bhaav-data.json || echo "(file missing)"
          echo ""
          echo "----- number of IPOs -----"
          grep -c '"name"' bhaav-data.json || echo "0"

      - name: Commit updated data
        run: |
          git config user.name  "bhaav-bot"
          git config user.email "bhaav-bot@users.noreply.github.com"
          git add bhaav-data.json
          if git diff --staged --quiet; then
            echo "No change in data - nothing to commit."
          else
            git commit -m "auto: update IPO data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Pushed updated data."
          fi
