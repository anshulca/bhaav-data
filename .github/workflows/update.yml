name: Update Bhaav IPO data

# Runs every 30 minutes, plus on manual trigger.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# allow the workflow to commit back to the repo
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch fresh IPO data
        run: node fetch-ipo.js

      - name: Commit updated data
        run: |
          git config user.name  "bhaav-bot"
          git config user.email "bhaav-bot@users.noreply.github.com"
          git add bhaav-data.json
          # commit only if something changed
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: update IPO data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
