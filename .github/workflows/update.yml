name: Update Bhaav IPO data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a Telegram test message now (regardless of IPO dates)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch fresh IPO data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_telegram) && '1' || '0' }}
        run: node fetch-ipo.js

      - name: Commit updated data
        run: |
          git config user.name  "bhaav-bot"
          git config user.email "bhaav-bot@users.noreply.github.com"
          if [ -f bhaav-data.json ]; then
            git add -A
            if git diff --staged --quiet; then
              echo "No change - nothing to commit."
            else
              git commit -m "auto: update IPO data $(date -u '+%Y-%m-%d %H:%M UTC')"
              git push
              echo "Pushed updated data."
            fi
          else
            echo "bhaav-data.json was not created - skipping commit."
          fi
